spring.application.name=JobTrack

# ---------- Database (MySQL 8) ----------
# The database is created on first start if it does not exist (needs CREATE privilege).
# Override with the JOBTRACK_DB_* environment variables.
spring.datasource.url=${JOBTRACK_DB_URL:jdbc:mysql://localhost:3306/jobtrack?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=LOCAL}
spring.datasource.username=${JOBTRACK_DB_USER:root}
spring.datasource.password=${JOBTRACK_DB_PASSWORD:root}

# The schema is managed only by Flyway migrations
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# All ids are UUIDs stored as CHAR(36) (readable in SQL tools; same behaviour in MySQL and the H2 test database)
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.flyway.enabled=true

# ---------- Uploaded files ----------
# Uploaded files live on disk under this directory (the database stores only metadata).
# Back up this directory together with the MySQL database.
jobtrack.data-dir=${JOBTRACK_DATA_DIR:./data}
jobtrack.storage.dir=${jobtrack.data-dir}/files

# The business limit (jobtrack.upload.max-file-size) is lower than the servlet limit,
# so files between 5MB and 20MB get a friendly message instead of a reset connection.
jobtrack.upload.max-file-size=5MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
server.tomcat.max-swallow-size=30MB

# ---------- Initial administrator ----------
# Created on startup when the database has no administrator.
# If JOBTRACK_ADMIN_PASSWORD is not set, a random password is generated and printed once in the startup log.
jobtrack.admin.email=${JOBTRACK_ADMIN_EMAIL:admin@jobtrack.co.nz}
jobtrack.admin.password=${JOBTRACK_ADMIN_PASSWORD:123456}

# ---------- Web ----------
server.error.whitelabel.enabled=false
server.servlet.session.timeout=8h
server.servlet.session.cookie.same-site=lax

# English UI: always format dates in English, whatever the browser language
spring.web.locale=en_NZ
spring.web.locale-resolver=fixed
