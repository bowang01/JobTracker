spring.application.name=JobTrack

# ---------- Server ----------
# HTTP port; override with the PORT environment variable
server.port=${PORT:5566}
# Behind a reverse proxy: honour X-Forwarded-* headers so redirects keep https
server.forward-headers-strategy=framework

# ---------- Database (MySQL 8) ----------
# The database is created on first start if it does not exist (needs CREATE privilege).
# Override with the JOBTRACK_DB_* environment variables.
spring.datasource.url=${JOBTRACK_DB_URL:jdbc:mysql://localhost:3306/jobtrack?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=LOCAL}
spring.datasource.username=${JOBTRACK_DB_USER:root}
spring.datasource.password=${JOBTRACK_DB_PASSWORD:root}

# The schema is managed only by Flyway migrations
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# All ids are UUIDs stored as CHAR(36) (readable in SQL tools; same behaviour in MySQL and the H2 test database)
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.flyway.enabled=true

# ---------- Uploaded files ----------
# Uploaded files live on disk under this directory (the database stores only metadata).
# Back up this directory together with the MySQL database.
jobtrack.data-dir=${JOBTRACK_DATA_DIR:./data}
jobtrack.storage.dir=${jobtrack.data-dir}/files

# The business limit (jobtrack.upload.max-file-size) is lower than the servlet limit,
# so files between 5MB and 20MB get a friendly message instead of a reset connection.
jobtrack.upload.max-file-size=5MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
server.tomcat.max-swallow-size=30MB

# ---------- Initial administrator ----------
# Created on startup when the database has no administrator.
# If JOBTRACK_ADMIN_PASSWORD is not set, a random password is generated and printed once in the startup log.
jobtrack.admin.email=${JOBTRACK_ADMIN_EMAIL:admin@jobtrack.co.nz}
jobtrack.admin.password=${JOBTRACK_ADMIN_PASSWORD:123456}

# ---------- Demo account ----------
# On by default. A regular user with a few sample applications, interviews and questions is created on start,
# its email/password are shown to visitors ("Try the demo" on the interview hall and the sign-in page),
# it cannot change its email/password or share questions, and it is wiped and re-created on the reset schedule.
jobtrack.demo.enabled=${JOBTRACK_DEMO_ENABLED:true}
jobtrack.demo.email=${JOBTRACK_DEMO_EMAIL:demo@jobtrack.co.nz}
jobtrack.demo.password=${JOBTRACK_DEMO_PASSWORD:demo1234}
# Spring cron (second minute hour day month weekday) in the zone below; "-" turns the reset off
jobtrack.demo.reset-cron=${JOBTRACK_DEMO_RESET_CRON:0 0 4 * * *}
jobtrack.demo.reset-zone=Pacific/Auckland

# ---------- Web ----------
server.error.whitelabel.enabled=false
server.servlet.session.timeout=8h
server.servlet.session.cookie.same-site=lax

# English UI: always format dates in English, whatever the browser language
spring.web.locale=en_NZ
spring.web.locale-resolver=fixed

# ---------- Performance ----------
# CSS/JS URLs get a content hash (/css/app-3f2c....css) and are cached by the browser for a year;
# a changed file gets a new hash, so users never see a stale version.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# Request timing: every request slower than this is logged as "SLOW GET /... in N ms, M SQL".
# To see the timing of every request, set the level below to DEBUG.
jobtrack.slow-request-ms=500
logging.level.com.jobtrack.web.RequestTimingFilter=INFO
# Count the SQL statements per request (shown in the timing log line)
spring.jpa.properties.hibernate.session_factory.statement_inspector=com.jobtrack.config.SqlStatementCounter
