<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Users')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('admin-users')}"></header>
<main class="page">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="page-head">
        <div>
            <h1>Users</h1>
            <div class="sub"><strong th:text="${#lists.size(rows)}">0</strong> regular user(s)</div>
        </div>
    </div>

    <details class="card filter-panel" data-filter-panel>
        <summary th:replace="~{fragments/layout :: filter-summary}"></summary>
        <form th:action="@{/admin/users/filter}" method="post" class="filters">
            <div class="field">
                <label for="q">Search</label>
                <input type="text" id="q" name="q" th:value="${q}" placeholder="Email or display name">
            </div>
            <div class="field">
                <label for="state">Account</label>
                <select id="state" name="state">
                    <option value="" th:selected="${state == ''}">All</option>
                    <option value="active" th:selected="${state == 'active'}">Active</option>
                    <option value="disabled" th:selected="${state == 'disabled'}">Disabled</option>
                </select>
            </div>
            <div class="filter-actions">
                <button type="submit" class="btn btn-primary">Filter</button>
                <button type="submit" class="btn" th:formaction="@{/admin/users/reset}">Reset</button>
            </div>
        </form>
    </details>

    <section class="card card-flush">
        <div class="table-wrap">
            <table class="rtable">
                <thead>
                <tr>
                    <th>User</th>
                    <th>Account</th>
                    <th>Applications</th>
                    <th>Last sign-in</th>
                    <th>Registered</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(rows)}">
                    <td colspan="6" class="empty">No users match.</td>
                </tr>
                <tr th:each="row : ${rows}" th:with="u=${row.user()}">
                    <td class="cell-main">
                        <a class="primary" th:href="@{/admin/users/{id}(id=${u.id})}" th:text="${u.email}"></a>
                        <div class="secondary" th:if="${u.displayName}" th:text="${u.displayName}"></div>
                    </td>
                    <td data-label="Account">
                        <span class="badge" th:classappend="${u.enabled} ? 's-offer' : 's-rejected'"
                              th:text="${u.enabled} ? 'Active' : 'Disabled'"></span>
                    </td>
                    <td data-label="Applications" th:text="${row.applicationCount()}">0</td>
                    <td data-label="Last sign-in" class="secondary"
                        th:text="${u.lastLoginAt != null} ? ${#temporals.format(u.lastLoginAt, 'yyyy-MM-dd HH:mm')} : 'Never'"></td>
                    <td data-label="Registered" class="secondary" th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd')}"></td>
                    <td class="cell-actions">
                        <div class="actions">
                            <a class="btn btn-sm" th:href="@{/admin/users/{id}(id=${u.id})}">View</a>
                            <form class="inline" method="post" th:action="@{/admin/users/{id}/enabled(id=${u.id})}">
                                <input type="hidden" name="enabled" th:value="${!u.enabled}">
                                <button type="submit" class="btn btn-sm" th:text="${u.enabled} ? 'Disable' : 'Enable'"></button>
                            </form>
                            <form class="inline" method="post" th:action="@{/admin/users/{id}/delete(id=${u.id})}"
                                  th:attr="data-confirm='Delete ' + ${u.email} + ' and all ' + ${row.applicationCount()} + ' of their applications and documents? This cannot be undone.'">
                                <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
