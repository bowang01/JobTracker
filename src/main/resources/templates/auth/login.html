<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('login')}"></header>
<main class="auth-split">
    <section th:replace="~{fragments/auth :: intro}"></section>
    <div class="auth-panel">
    <div class="card auth-card">
        <h1>Sign in to JobTrack</h1>
        <p class="muted">Welcome back. Sign in with your email.</p>

        <div th:replace="~{fragments/layout :: flash}"></div>

        <form th:action="@{/login}" method="post">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign in</button>
        </form>
        <p class="auth-foot">No account yet? <a th:href="@{/register}">Register</a></p>

        <!-- Shared demo account with sample data, for visitors who just want to look around -->
        <div class="demo-box" th:if="${demoAccount.enabled}">
            <p><strong>Just looking around?</strong> Sign in to the demo account with sample applications,
                interviews and questions.</p>
            <form th:action="@{/login}" method="post">
                <input type="hidden" name="email" th:value="${demoAccount.email}">
                <input type="hidden" name="password" th:value="${demoAccount.password}">
                <button type="submit" class="btn">Try the demo account</button>
            </form>
        </div>
    </div>
    </div>
</main>
</body>
</html>
