name: Deploy to Hostinger VPS

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Never run two deployments at the same time
concurrency:
  group: deploy-jobtrack
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bowang01/jobtracker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Integration tests use H2 in MySQL mode, so no database service is needed
      - name: Build and test
        run: mvn -B verify

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Hostinger
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: jobtrack
          docker-compose-path: docker-compose.prod.yml
          environment-variables: |
            IMAGE_TAG=${{ github.sha }}
            JOBTRACK_ADMIN_EMAIL=${{ vars.JOBTRACK_ADMIN_EMAIL }}
            JOBTRACK_ADMIN_PASSWORD=${{ secrets.JOBTRACK_ADMIN_PASSWORD }}
            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
