# Reverse proxy for JobTrack. Replace jobtrack.bowang.tech with your real domain.
#
# A) nginx installed on the VPS host: copy to /etc/nginx/sites-available/jobtrack,
#    link it into sites-enabled, then: nginx -t && systemctl reload nginx
#    HTTPS: certbot --nginx -d jobtrack.bowang.tech
# B) nginx running as a container on the `proxy` network: use
#    proxy_pass http://jobtrack-app:5566;  instead of 127.0.0.1
server {
    listen 80;
    server_name jobtrack.bowang.tech;

    # Spring allows 25MB per request (server.tomcat.max-swallow-size=30MB)
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:5566;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 60s;
    }
}
