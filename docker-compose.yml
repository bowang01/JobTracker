# Optional: a local MySQL 8 for development.  Start with:  docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: jobtrack-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: jobtrack
      MYSQL_USER: jobtrack
      MYSQL_PASSWORD: jobtrack
      MYSQL_ROOT_PASSWORD: root
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "3306:3306"
    volumes:
      - jobtrack-mysql-data:/var/lib/mysql

volumes:
  jobtrack-mysql-data:
